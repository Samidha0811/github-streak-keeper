spring.application.name=github-streak-keeper

# ==============================================================================
# GitHub Streak Keeper Configuration
# ==============================================================================

# Scheduler settings
# Default: 9:00 AM IST (Indian Standard Time) every day
streak-keeper.scheduler.enabled=true
streak-keeper.scheduler.cron=0 0 9 * * *
streak-keeper.scheduler.zone=Asia/Kolkata

# Git repository settings
# Uses current repository root by default
streak-keeper.git.repository-path=.
streak-keeper.git.remote=origin
streak-keeper.git.branch=main
streak-keeper.git.activity-file=activity/daily-log.md
streak-keeper.git.timeout-seconds=30

# Optional fallback Git author identity (used if local/global git config is not set)
streak-keeper.git.author-name=Samidha0811
streak-keeper.git.author-email=

# Activity content template
streak-keeper.activity.message-template=GitHub Streak Keeper automation recorded its daily execution.

# Optional API key protection for manual trigger endpoint POST /api/jobs/daily-commit
# If empty or not set, manual trigger does not require an API key
streak-keeper.api.key=

# Actuator & Logging
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.com.streakkeeper=INFO
